<!doctype html><html><head><meta charset="utf-8"><title>Zodiac Admin</title>
<style>
html,body{margin:0;height:100%;background:#440000;overflow:hidden;font-family:Segoe UI,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
body:before,body:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(224,161,0,.18)}
body:before{width:520px;height:520px;left:-200px;top:-210px}
body:after{width:430px;height:430px;right:-160px;bottom:-230px}
img{width:86%;max-width:480px;position:relative;z-index:2}
p{position:relative;z-index:2;color:rgba(255,255,255,.65);letter-spacing:.12em;font-size:12px;text-transform:uppercase;margin:6px 0 0}
.bar{position:relative;z-index:2;width:140px;height:3px;background:rgba(224,161,0,.25);margin-top:18px;overflow:hidden;border-radius:3px}
.bar i{display:block;height:100%;width:45%;background:#e0a100;animation:m 1.2s infinite ease-in-out}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
</style></head><body><img src="assets/hero_logo.png" alt="Zodiac Group - Health and Wealth"><p>Administrator dashboard</p><div class="bar"><i></i></div></body></html>
